name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run the full Ubuntu 26.04 Podman installation test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: ./scripts/test
  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: ./scripts/test-podman
